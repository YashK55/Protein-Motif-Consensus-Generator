name: Release Windows Application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Extract version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag -match '^v(.*)$') { $Matches[1] } else { $tag }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compile and Package Java App
        shell: cmd
        run: |
          echo Creating build directories...
          if exist bin rmdir /s /q bin
          if exist out rmdir /s /q out
          if exist dist rmdir /s /q dist
          mkdir bin
          mkdir out
          mkdir dist
          
          echo Compiling Java source files...
          javac -d bin src/*.java
          
          echo Packaging into a runnable JAR...
          jar --create --file out/ProteinMotifConsensusGenerator.jar --main-class=Main -C bin .
          
          echo Creating installer with jpackage...
          jpackage --type exe --input out --dest dist --name "ProteinMotifConsensusGenerator" --main-jar ProteinMotifConsensusGenerator.jar --main-class Main --win-menu --win-shortcut --win-dir-chooser --icon logo.ico --app-version ${{ steps.get_version.outputs.version }}

      - name: Verify Installer Build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ProteinMotifConsensusGenerator-*.exe")) {
            Write-Error "Installer not found in dist/"
            exit 1
          }
          Get-ChildItem dist/

      - name: Create Release and Upload Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry loop for creating the release
          for i in {1..5}; do
            echo "Attempt $i to create release..."
            if gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes "Automated release for version ${{ github.ref_name }}." ; then
              echo "Release created successfully."
              break
            else
              if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
                echo "Release already exists."
                break
              fi
              echo "Release creation failed. Retrying in 10 seconds..."
              sleep 10
            fi
            if [ $i -eq 5 ]; then
              echo "Failed to create release after 5 attempts."
              exit 1
            fi
          done

          # Retry loop for uploading the asset
          for i in {1..5}; do
            echo "Attempt $i to upload assets..."
            if gh release upload "${{ github.ref_name }}" dist/ProteinMotifConsensusGenerator-*.exe --clobber ; then
              echo "Assets uploaded successfully."
              break
            else
              echo "Asset upload failed. Retrying in 10 seconds..."
              sleep 10
            fi
            if [ $i -eq 5 ]; then
              echo "Failed to upload assets after 5 attempts."
              exit 1
            fi
          done
